# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "website-mobile-template"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["https://127.0.0.1:4321", "http://127.0.0.1:4321/**", "https://127.0.0.1:4321/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Custom bilingual templates (branch on .Data.lang, set via inviteUserByEmail/signInWithOtp
# metadata) — without content_path here, GoTrue silently falls back to its untranslated
# default template and these files are never actually rendered.
[auth.email.template.invite]
subject = "Invitation / Pozvánka"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your sign-in link / Váš přihlašovací odkaz"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email / Potvrďte svůj e-mail"
content_path = "./supabase/templates/confirmation.html"

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Your code is {{ .Code }} ."

