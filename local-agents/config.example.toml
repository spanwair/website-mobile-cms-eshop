[server]
base_url = "http://192.168.0.108:8080/v1"
model_alias = "qwen3.6-35b-a3b"
request_timeout_s = 3600  # match [limits].max_wall_clock_s — a single slow
                          # prefill on constrained hardware can legitimately
                          # take minutes; this must not be shorter than that
# llama-server's --api-key token. Prefer setting the LLAMA_SERVER_API_KEY env
# var instead of this field — it's a changeable password, not a repo secret,
# and the env var keeps it out of config.toml entirely. This field is only a
# fallback if you'd rather keep it in your (gitignored) config.toml.
# api_key = ""

[repo]
root = "/home/jan/PROJECTS/react-native/website-mobile-template"
exclude = [
  "shared/supabase/types.ts",
  "shared/i18n/locales/en.ts",
  "shared/i18n/locales/cs.ts",
  "node_modules",
  ".git",
  "dist",
  ".treehouse",
]

[budget]
# context_window/reserve_output/reserve_tool_overhead/system_prompt_max/repo_map_max
# are documentation of the intended split, not enforced anywhere in code today —
# only retrieved_files_max (below) is actually read. Don't rely on the others.
context_window = 100000
reserve_output = 8000
reserve_tool_overhead = 10000
system_prompt_max = 6000
repo_map_max = 3000
# Fallback for any role not listed in retrieved_files_by_role.
retrieved_files_max = 20000

# Per-role file-content budget (tokens). Roles that only classify/scope/review
# don't need anywhere near what the implementing specialist needs — a flat 60000
# for every role was the single biggest source of wasted prefill (planner and
# tester were paying for the same file dump as the specialist doing the actual
# edit). Tune these against the token/timing table each session log now prints
# (memory.log_session) rather than guessing further.
[budget.retrieved_files_by_role]
planner = 4000
architect = 15000
website-specialist = 45000
mobile-specialist = 45000
supabase-specialist = 45000
tester = 20000
code-reviewer = 25000
disclaimer = 20000

[limits]
# Fallback for any role not listed in max_tool_calls_by_role.
max_tool_calls_per_task = 40
max_wall_clock_s = 3600
max_files_touched = 12
max_lines_per_file = 200

# Per-role cap. Every /chat/completions call in agent_loop.run_task's loop resends
# the FULL accumulated messages history — more tool calls means a larger prompt on
# every subsequent round trip, not just more calls. Roles whose files are already
# pinned by context_builder (planner, tester, code-reviewer, disclaimer) rarely need
# more than a couple of read_file calls beyond what's already inlined; keeping their
# ceiling low bounds the worst case instead of letting a confused role loop its way
# into an ever-growing prompt (agent_loop._prune_old_tool_output is the other half
# of this guard — see GUIDE.md "Bounding tool-loop growth").
[limits.max_tool_calls_by_role]
planner = 6
architect = 15
website-specialist = 40
mobile-specialist = 40
supabase-specialist = 40
tester = 25
code-reviewer = 15
disclaimer = 15

[workspace]
lease_holder_prefix = "local-agent"
never_commit = true
never_push = true

[loop]
enabled_hours = "any"   # "any" | "22:00-08:00" | custom "HH:MM-HH:MM"
poll_interval_s = 60

[gate]
website_dir = "website"
mobile_dir = "mobile"
shared_dir = "shared"
admin_permission_paths = [
  "website/src/pages/admin/",
  "website/src/components/cms/Sidebar.astro",
  "website/src/lib/admin.ts",
  "shared/constants/permissions.ts",
]
admin_permission_specs = [
  "09-users-roles",
  "12-access-control",
  "14-multi-org-security",
  "15-role-access",
  "16-invite-flow",
  "17-invite-roles",
]
