# Cloudflare Workers config (the current unified platform — what "Create a Worker" in the
# dashboard sets up, superseding the older separate Pages product). "name" must match the
# Worker project name you create in the dashboard.
name = "mamtodoma-website"
main = "./dist/_worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Secrets (SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, OCI_PRIVATE_KEY, SEND_EMAIL_HOOK_SECRET,
# etc.) are NOT set here — with a GitHub-connected build, .env.production on your laptop never
# reaches Cloudflare's build machine, so set them under the Worker's Settings → Variables and
# Secrets in the dashboard (as encrypted Secrets, which survive every deploy).
#
# Non-secret plain-text vars MUST live in [vars] below, not only in the dashboard: wrangler
# governs plain-text vars on every deploy, so any dashboard-only plain var gets wiped on the
# next build. (Encrypted Secrets are untouched by deploys; plain-text vars are not.)
[vars]
OCI_REGION = "eu-frankfurt-1"
OCI_KEY_FINGERPRINT = "31:0b:fa:46:ed:29:34:f9:1a:2c:20:7a:4e:13:84:00"
EMAIL_FROM = "noreply@smalljobs.cz"
EMAIL_FROM_NAME = "noreply@smalljobs.cz"
# App's canonical origin. The Send Email hook builds every auth link as ${SHOP_URL}/auth/callback.
# Non-PUBLIC name on purpose: PUBLIC_* is build-inlined by Vite and would ignore this runtime value.
# Origin only — no trailing path, no /auth/v1.
SHOP_URL = "https://mamtodoma.cz"
